# Supabase-configuratie voor Jobmarkt (project "jobmarkt", nog aan te maken
# of te koppelen: zie docs/LIVEGANG.md). Wordt toegepast met
# `supabase config push` na `supabase link`.
project_id = "jobmarkt"

[api]
schemas = ["public"]
max_rows = 200

[auth]
# Vervang door het definitieve domein vóór livegang.
site_url = "https://jobmarkt.example"
additional_redirect_urls = ["http://localhost:3100"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"

[auth.email.template.confirmation]
subject = "Bevestig je e-mailadres voor Jobmarkt"
content_path = "./supabase/templates/bevestigen.html"

[auth.email.template.recovery]
subject = "Nieuw wachtwoord voor Jobmarkt"
content_path = "./supabase/templates/wachtwoord.html"

[auth.email.template.email_change]
subject = "Bevestig je nieuwe e-mailadres voor Jobmarkt"
content_path = "./supabase/templates/email-wijzigen.html"

[storage]
file_size_limit = "10MiB"
