# Supabase-configuratie voor Jobmarkt (project "jobmarkt", ref nqumwjvjtzwseafvvhxt,
# organisatie jobmarkt, eu-central-1). Wordt toegepast met
# `supabase config push` na `supabase link`.
project_id = "jobmarkt"

[api]
schemas = ["public"]
max_rows = 200

[auth]
# Tijdelijk het Vercel-adres; vervang door het eigen domein zodra dat er is.
site_url = "https://jobmarkt.vercel.app"
additional_redirect_urls = ["https://jobmarkt.vercel.app/**", "http://localhost:3100/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.rate_limit]
# Mails per uur voor het hele project (alleen instelbaar met eigen SMTP).
email_sent = 100
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"

# Eigen SMTP via Resend. Tijdelijk verzonden vanaf het geverifieerde domein
# chas.nu tot Jobmarkt een eigen domein heeft; de sleutel komt uit de
# omgeving (RESEND_API_KEY) en staat nooit in de repo.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "noreply@chas.nu"
sender_name = "Jobmarkt"

[auth.email.template.confirmation]
subject = "Bevestig je e-mailadres voor Jobmarkt"
content_path = "./supabase/templates/bevestigen.html"

[auth.email.template.recovery]
subject = "Nieuw wachtwoord voor Jobmarkt"
content_path = "./supabase/templates/wachtwoord.html"

[auth.email.template.email_change]
subject = "Bevestig je nieuwe e-mailadres voor Jobmarkt"
content_path = "./supabase/templates/email-wijzigen.html"

[storage]
file_size_limit = "10MiB"
