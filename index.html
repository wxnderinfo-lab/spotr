<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Spotr — Find Freelancers & Hire Local Talent</title>
    <meta name="description" content="Spotr connects clients with top freelancers for web development, design, photography, marketing, and more. Post a job or find your next project today." />
    <meta name="keywords" content="freelancers, hire talent, freelance marketplace, web development, design, photography, marketing, Netherlands" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://spotr.app" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spotr" />
    <meta property="og:title" content="Spotr — Find Freelancers & Hire Local Talent" />
    <meta property="og:description" content="Spotr connects clients with top freelancers for web development, design, photography, marketing, and more. Post a job or find your next project today." />
    <meta property="og:url" content="https://spotr.app" />
    <meta property="og:image" content="/spotrr.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Spotr — Find Freelancers & Hire Local Talent" />
    <meta name="twitter:description" content="Spotr connects clients with top freelancers for web development, design, photography, marketing, and more." />
    <meta name="twitter:image" content="/spotrr.png" />

    <!-- PWA / Mobile App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Spotr" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Spotr",
      "url": "https://spotr.app",
      "description": "Freelancer marketplace connecting clients with top talent across web development, design, photography, marketing, and more.",
      "sameAs": []
    }
    </script>

    <!-- Google Analytics 4 (replace G-XXXXXXXXXX with your measurement ID) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX', { send_page_view: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
